    <main>
      <h1>Formulário de Inscrição</h1>
      <p>Preencha os dados abaixo para se juntar à nossa rede de apoio.</p>

      <section>
        <h2>Seus Dados</h2>
        <form action="#" method="POST">
          <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required minlength="3" />

            <label for="nome">CPF:</label>
            <input
              type="text"
              id="cpf"
              name="cpf"
              required
              minlength="14"
              pattern="\d{3}.\d{3}.\d{3}-\d{2}"
              placeholder="000.000.000-00"
            />

            <label for="nome">Telefone / WhatsApp:</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              required
              maxlength="15"
              pattern="\(\d{2}\)\s\d{4,5}-\d{4}"
              placeholder="(00) 00000-0000"
            />

            <label for="nome">E-mail:</label>
            <input type="email" id="email" name="email" required />
          </fieldset>

          <fieldset>
            <legend>Como deseja ajudar?</legend>
            <label
              ><input type="checkbox" name="interesse" value="voluntariado" />
              Voluntariado Presencial</label
            >
            <label
              ><input type="checkbox" name="interesse" value="doacao" /> Doação
              Financeira</label
            >
          </fieldset>
          <<button type="submit">Enviar cadastro</button>
        </form>
      </section>
    </main>

    <footer>
